<header>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand"
                href="{{ .Site.Home.RelPermalink }}">{{ partial "ypertex-logogram-2020-03.svg" }}</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menuHeader"
                aria-controls="menuHeader" aria-expanded="false" aria-label="Toggle navigation">
                <i class="las la-bars"></i>
            </button>
            <div class="navbar-collapse collapse" id="menuHeader">
                <div class="navbar-nav mr-md-auto">
                    {{ $currentPage := . }}
                    {{ range .Site.Menus.header }}
                    <a href="{{ .URL | relURL }}"
                        class="nav-item nav-link{{ if in $currentPage.RelPermalink .URL }} active{{ end }}">{{ .Name }}</a>
                    {{ end }}
                </div>
                <div class="navbar-nav">
                    <hr>
                    {{ range .Site.Menus.social }}
                    <a href="{{ .URL }}" class="nav-item nav-link" title="{{ .Name }}">{{ .Pre }}<span
                            class="d-md-none"> {{ .Name }}</span></a>
                    {{ end }}
                    <a href="{{ `/index.xml` | relURL }}" class="nav-item nav-link" title="RSS"><i
                            class="las la-rss"></i><span class="d-md-none"> RSS</span></a>
                    <div class="nav-item dropdown yx-theme-picker">
                        <button class="nav-link dropdown-toggle yx-theme-toggle" type="button" id="themeMenu"
                            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                            aria-label="Theme: System. Choose color theme.">
                            <i class="las la-desktop" data-theme-icon aria-hidden="true"></i><span
                                class="d-md-none" data-theme-label> Theme: System</span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="themeMenu">
                            <button class="dropdown-item" type="button" data-theme-value="light" aria-pressed="false">
                                <i class="las la-sun" aria-hidden="true"></i> Light
                                <i class="las la-check yx-theme-check" aria-hidden="true"></i>
                            </button>
                            <button class="dropdown-item" type="button" data-theme-value="dark" aria-pressed="false">
                                <i class="las la-moon" aria-hidden="true"></i> Dark
                                <i class="las la-check yx-theme-check" aria-hidden="true"></i>
                            </button>
                            <button class="dropdown-item" type="button" data-theme-value="system" aria-pressed="true">
                                <i class="las la-desktop" aria-hidden="true"></i> System
                                <i class="las la-check yx-theme-check" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>
